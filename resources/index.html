    <div class="px-4 py-3 border-t border-indigo-700">
      <div class="text-xs text-indigo-400 uppercase tracking-wider mb-1">Établissement</div>
      <div id="sidebar-org" class="text-sm font-semibold text-white truncate">—</div>
      <select id="org-switcher" class="hidden form-input mt-2 org-switcher"></select>
      <div class="mt-3 pt-3 border-t border-indigo-800">
        <div id="sidebar-user" class="text-sm font-medium text-indigo-100 truncate">—</div>
        <div id="sidebar-role" class="text-xs text-indigo-400">—</div>
        <button class="btn btn-sm mt-2 w-full justify-center btn-sidebar" onclick="logout()">Déconnexion</button>
      </div>
      <div class="mt-3 text-xs text-indigo-400 cursor-pointer" onclick="showAbout()" title="Crédits">
        <div class="font-semibold text-indigo-300">Bambyno Studio App</div>
        <div>v1.1.0</div>
      </div>
    </div>
  </aside>

  <!-- Page content -->
  <main id="main-panel" class="hidden flex-1 overflow-y-auto">
    <div id="app" class="p-8 min-h-full"></div>
  </main>

  <!-- Toast -->
  <div id="toast" class="hidden fixed bottom-6 right-6 px-5 py-3 rounded-lg text-white shadow-lg z-50 text-sm font-medium"></div>

  <!-- Modal overlay (shared) -->
  <div id="modal-overlay" class="hidden fixed inset-0 bg-black bg-opacity-50 z-40"></div>

  <!-- Form / content modal -->
  <div id="modal" class="hidden fixed z-50 bg-white rounded-xl shadow-2xl p-6"
       style="top:50%;left:50%;transform:translate(-50%,-50%);width:500px;max-width:92vw;max-height:90vh;overflow-y:auto;"></div>

  <!-- Confirm dialog -->
  <div id="confirm-overlay" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50"></div>
  <div id="confirm-modal" class="hidden fixed z-50 bg-white rounded-xl shadow-2xl p-6 text-center"
       style="top:50%;left:50%;transform:translate(-50%,-50%);width:400px;">
    <div id="confirm-msg" class="text-gray-800 font-medium mb-6"></div>
    <div class="flex justify-center gap-3">
      <button id="confirm-cancel" class="btn btn-secondary">Annuler</button>
      <button id="confirm-ok" class="btn btn-danger">Confirmer</button>
    </div>
  </div>

  <!-- Scripts: order is critical -->

  <script src="/js/pages/eleves.js"></script>
  <script src="/js/pages/eleve.js"></script>
  <script src="/js/pages/paiement.js"></script>
  <script src="/js/pages/notes.js"></script>
  <script src="/js/pages/matieres.js"></script>
  <script src="/js/pages/styles.js"></script>
  <script src="/js/pages/utilisateurs.js"></script>
  <script src="/js/pages/organisations.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/updater.js"></script>
