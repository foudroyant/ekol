<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ekol — Gestion Scolaire</title>
  <link rel="icon" type="image/svg+xml" href="/icons/logo.svg">
  <link rel="icon" type="image/png" href="/icons/appIcon.png">
  <link rel="stylesheet" href="/css/tailwind.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="flex h-screen bg-gray-100 text-gray-800 overflow-hidden">

  <!-- Sidebar -->

    <div class="px-5 py-4 border-b border-indigo-700 flex items-center gap-3">

      <div>
        <div class="text-xl font-bold tracking-wide leading-tight">Ekol</div>
        <div class="text-xs text-indigo-300">Gestion scolaire</div>
      </div>
    </div>
    <nav class="flex-1 py-3 space-y-0.5 px-2">
      <a data-route="/dashboard" class="nav-link" onclick="routerNavigate('/dashboard')">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
        Dashboard
      </a>
      <a data-route="/cycles" class="nav-link" onclick="routerNavigate('/cycles')">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
        Cycles
      </a>
      <a data-route="/classes" class="nav-link" onclick="routerNavigate('/classes')">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
        Classes
      </a>
      <a data-route="/eleves" class="nav-link" onclick="routerNavigate('/eleves')">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        Élèves
      </a>
      <a data-route="/recherche" class="nav-link" onclick="routerNavigate('/recherche')">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        Recherche
      </a>
      <a data-route="/parametres" class="nav-link" onclick="routerNavigate('/parametres')">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        Paramètres
      </a>
    </nav>
    <div class="px-4 py-3 border-t border-indigo-700 text-xs text-indigo-400 cursor-pointer" onclick="showAbout()" title="Cliquez pour voir les crédits">
      <div class="font-semibold text-indigo-300">Bambyno Studio App</div>
      <div>v1.0.0</div>
    </div>
  </aside>

  <!-- Page content -->
  <main class="flex-1 overflow-y-auto">
    <div id="app" class="p-8 min-h-full"></div>
  </main>

  <!-- Toast -->
  <div id="toast" class="hidden fixed bottom-6 right-6 px-5 py-3 rounded-lg text-white shadow-lg z-50 text-sm font-medium"></div>

  <!-- Modal overlay (shared) -->
  <div id="modal-overlay" class="hidden fixed inset-0 bg-black bg-opacity-50 z-40"></div>

  <!-- Form / content modal -->
  <div id="modal" class="hidden fixed z-50 bg-white rounded-xl shadow-2xl p-6"
       style="top:50%;left:50%;transform:translate(-50%,-50%);width:500px;max-height:90vh;overflow-y:auto;"></div>

  <!-- Confirm dialog -->
  <div id="confirm-overlay" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50"></div>
  <div id="confirm-modal" class="hidden fixed z-50 bg-white rounded-xl shadow-2xl p-6 text-center"
       style="top:50%;left:50%;transform:translate(-50%,-50%);width:400px;">
    <div id="confirm-msg" class="text-gray-800 font-medium mb-6"></div>
    <div class="flex justify-center gap-3">
      <button id="confirm-cancel" class="btn btn-secondary">Annuler</button>
      <button id="confirm-ok" class="btn btn-danger">Confirmer</button>
    </div>
  </div>

  <!-- Scripts: order is critical -->
  <script src="/js/neutralino.js"></script>
  <script src="/js/sql-wasm.js"></script>
  <script src="/js/wasm-b64.js"></script>
  <script src="/js/db.js"></script>
  <script src="/js/router.js"></script>
  <script src="/js/pages/dashboard.js"></script>
  <script src="/js/pages/cycles.js"></script>
  <script src="/js/pages/classes.js"></script>
  <script src="/js/pages/eleves.js"></script>
  <script src="/js/pages/eleve.js"></script>
  <script src="/js/pages/paiement.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/updater.js"></script>
</body>
</html>
