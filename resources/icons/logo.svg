<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Open book -->
  <path d="M40 120 L100 80 L160 120 L100 160 Z" fill="#e0e7ff" stroke="#4f46e5" stroke-width="4" stroke-linejoin="round"/>
  <path d="M40 120 L40 80 C40 80 70 65 100 80 L100 120 Z" fill="#c7d2fe" stroke="#4f46e5" stroke-width="3"/>
  <path d="M160 120 L160 80 C160 80 130 65 100 80 L100 120 Z" fill="#a5b4fc" stroke="#4f46e5" stroke-width="3"/>
  <!-- Book spine line -->
  <line x1="100" y1="80" x2="100" y2="160" stroke="#4f46e5" stroke-width="3"/>
  <!-- Book pages lines -->
  <line x1="70" y1="108" x2="100" y2="90" stroke="#818cf8" stroke-width="2" stroke-dasharray="3 2"/>
  <line x1="130" y1="108" x2="100" y2="90" stroke="#818cf8" stroke-width="2" stroke-dasharray="3 2"/>
  <line x1="70" y1="124" x2="100" y2="106" stroke="#818cf8" stroke-width="2" stroke-dasharray="3 2"/>
  <line x1="130" y1="124" x2="100" y2="106" stroke="#818cf8" stroke-width="2" stroke-dasharray="3 2"/>
  <!-- Graduation cap (mortarboard) -->
  <path d="M100 30 L30 70 L100 110 L170 70 Z" fill="#4f46e5" stroke="#3730a3" stroke-width="4" stroke-linejoin="round"/>
  <!-- Cap top detail -->
  <path d="M100 30 L100 50" stroke="#3730a3" stroke-width="4" stroke-linecap="round"/>
  <!-- Tassel -->
  <line x1="100" y1="50" x2="100" y2="70" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="100" cy="72" r="3" fill="#f59e0b"/>
  <path d="M170 70 L170 85 Q170 95 160 95 L100 110" stroke="#4f46e5" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Cap bottom highlight -->
  <polygon points="40,72 160,72 170,70 30,70" fill="#6366f1" opacity="0.3"/>
</svg>
